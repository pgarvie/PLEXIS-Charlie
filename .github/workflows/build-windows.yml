name: Build Charlie (Windows VST3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake, x64)
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP tests
        run: cmake --build build --config Release --target CharlieDspTests

      - name: Run DSP tests (synthetic signals)
        run: .\build\Release\CharlieDspTests.exe

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --target Charlie_VST3 Charlie_Standalone --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-VST3-Windows-x64
          path: build/Charlie_artefacts/Release/VST3/Charlie.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Charlie-Standalone-Windows-x64
          path: build/Charlie_artefacts/Release/Standalone/Charlie.exe
